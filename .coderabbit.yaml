# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  auto_review:
    enabled: true
    # Review draft PRs too (CodeRabbit skips drafts by default).
    drafts: true
    # Do not pause/skip the auto review when a PR looks like work-in-progress
    # (no title keywords such as "WIP" suppress reviewing).
    ignore_title_keywords: []
  path_filters:
    # TouchGFX Designer output. These files are generated with "do not edit" markers.
    - "!Software/App/TouchGFX-GUI/generated/**"
    - "!SDK/Docs/Tutorials/*/Software/Apps/TouchGFX-GUI/generated/**"
    - "!SDK/Examples/Apps/*/Software/Apps/TouchGFX-GUI/generated/**"

    # TouchGFX Generator platform glue. These files are explicitly generated by TouchGFX Generator.
    - "!Software/Libs/Header/Components/GUI/generated/**"
    - "!Software/Libs/Source/Components/GUI/generated/**"
    - "!SDK/Libs/Header/SDK/Port/TouchGFX/generated/**"
    - "!SDK/Libs/Source/Port/TouchGFX/generated/**"

    # Vendored upstream library, imported unmodified. 398 files of it is enough
    # on its own to put a PR over CodeRabbit's file limit and make it skip the
    # review entirely, which is how this entry came to exist.
    #
    # Listed by directory rather than excluding ThirdParty wholesale: a local
    # patch to a vendored library is exactly the kind of change that should
    # still be reviewed.
    - "!Software/ThirdParty/ETLCPP/**"
